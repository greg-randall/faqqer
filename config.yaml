# =========================================================
# Faqqer Pipeline Configuration
# =========================================================

# --- Models ---
models:
  helper: gpt-4o-mini          # Steps 02, 05, 06 (categorize, score)
  smart: gpt-4o                # Step 06 audit (stronger cross-check)
  embedding: text-embedding-3-small  # Step 03 embeddings

# --- Generation ---
# Default temperature for LLM calls (extraction, synthesis, scoring).
# Lower = more deterministic, higher = more varied.
# Audit calls always use 0.0 regardless of this setting.
temperature: 0.2

# --- Clustering (Step 04) ---
clustering:
  dedup_similarity_threshold: 0.95   # Cosine sim above this = duplicate
  min_cluster_size: 5                # HDBSCAN minimum cluster size
  max_cluster_size: 15               # Triggers recursive split above this

# --- API ---
api:
  embedding_batch_size: 100          # Texts per embedding API call
  max_retries: 3                     # Retry attempts on transient errors
  retry_delay: 2                     # Base delay in seconds (doubles each retry)
  timeout: 120                       # API call timeout in seconds
